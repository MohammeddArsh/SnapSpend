<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#fafaf8" id="meta-theme-color" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SnapSpend" />
    <meta name="format-detection" content="telephone=no" />
    <title>SnapSpend — AI Personal Finance</title>
    <!-- Theme bootstrap (before paint to avoid flash) -->
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('snapspend-theme'); } catch (e) {}
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Style Bundle processed by Vite -->
    <link rel="stylesheet" href="/css/main.css" />
    <!-- Lucide Icons Library CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Cloudflare Turnstile for auth bot protection -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstile" defer></script>
  </head>
  <body class="font-sans pb-safe-bottom">

    <!-- Top Configuration Header / Credentials setup overlay (if Supabase not configured) -->
    <div id="setup-overlay" class="fixed inset-0 bg-slate-900/60 dark:bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
      <div class="glass-surface rounded-2xl max-w-md w-full shadow-2xl p-6 sm:p-7 border border-slate-200/70 dark:border-slate-700/60 animate-scale-in">
        <div class="flex items-center gap-2 mb-2">
          <span class="bg-brand-gradient p-2 rounded-xl text-white">
            <i data-lucide="database" class="w-4 h-4"></i>
          </span>
          <h2 class="text-xl font-bold text-slate-900 dark:text-white tracking-tight">Link Supabase</h2>
        </div>
        <p class="text-slate-500 dark:text-slate-400 text-sm mb-5">
          Provide your Supabase URL and Anon Key to activate the SnapSpend database. You can copy these from your Supabase Project Settings.
        </p>
        <form id="setup-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Supabase URL</label>
            <input type="text" id="setup-url" required placeholder="https://xxxxxx.supabase.co" class="w-full px-3.5 py-2.5 bg-white/80 dark:bg-slate-900/70 border border-slate-200 dark:border-slate-700 outline-none rounded-xl focus:border-brand-500 dark:focus:border-brand-400 focus:ring-2 focus:ring-brand-500/20 transition-all font-mono text-xs text-slate-900 dark:text-slate-100" />
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Anon API Key</label>
            <textarea id="setup-key" required rows="3" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." class="w-full px-3.5 py-2.5 bg-white/80 dark:bg-slate-900/70 border border-slate-200 dark:border-slate-700 outline-none rounded-xl focus:border-brand-500 dark:focus:border-brand-400 focus:ring-2 focus:ring-brand-500/20 transition-all font-mono text-xs resize-none text-slate-900 dark:text-slate-100"></textarea>
          </div>
          <button type="submit" class="w-full py-2.5 btn-primary text-white rounded-xl font-semibold transition-all text-sm flex items-center justify-center gap-2 cursor-pointer">
            <i data-lucide="plug" class="w-4 h-4"></i> Establish Connection
          </button>
        </form>
      </div>
    </div>

    <!-- Application Shell Header -->
    <header class="sticky top-0 z-30 pt-safe glass-surface border-b border-slate-200/70 dark:border-slate-800/70">
      <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 sm:gap-3 flex-nowrap px-3 sm:px-6 py-2 sm:py-3">
        <div class="flex items-center gap-2 sm:gap-3 min-w-0 shrink-0">
          <svg class="logo-mark" width="34" height="20" viewBox="0 0 40 24" fill="none" aria-hidden="true">
            <rect x="3" y="12" width="5" height="9" rx="1.5" fill="#10b981"/>
            <rect x="10" y="7" width="5" height="14" rx="1.5" fill="#0ea5e9"/>
            <rect x="17" y="10" width="5" height="11" rx="1.5" fill="#8b5cf6"/>
            <rect x="24" y="3" width="5" height="18" rx="1.5" fill="#f59e0b"/>
            <rect x="31" y="6" width="5" height="15" rx="1.5" fill="#64748b"/>
          </svg>
          <div class="min-w-0 hidden sm:block">
            <h1 class="font-display text-base font-bold text-slate-950 dark:text-white tracking-tight leading-none truncate">SnapSpend</h1>
          </div>
        </div>

        <!-- Month Navigation (Hidden on Auth Screen) -->
        <div id="month-navigation-ribbon" class="flex-1 min-w-0 flex justify-center sm:flex-none sm:justify-start hidden">
          <div class="flex items-center bg-slate-100/90 dark:bg-slate-800/70 rounded-full p-1 gap-0.5 sm:gap-1 max-w-full">
            <button id="btn-prev-month" class="p-2 sm:p-2 hover:bg-white dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white rounded-full transition-all cursor-pointer shrink-0" title="Previous Month" aria-label="Previous Month">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <span id="display-current-month" class="px-1.5 sm:px-3 text-[10px] sm:text-xs font-bold text-slate-800 dark:text-slate-200 min-w-0 sm:min-w-[110px] text-center tabular truncate">
              Loading...
            </span>
            <button id="btn-next-month" class="p-2 sm:p-2 hover:bg-white dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white rounded-full transition-all cursor-pointer shrink-0" title="Next Month" aria-label="Next Month">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Top Right Account Tray -->
        <div id="user-account-tray" class="flex items-center gap-0.5 sm:gap-1.5 shrink-0">
          <span id="user-display-email" class="hidden sm:inline text-xs font-semibold text-slate-600 dark:text-slate-300 max-w-[160px] truncate"></span>
          <button id="btn-theme-toggle" class="p-3 sm:p-2 text-slate-500 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 rounded-xl transition-all hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer" title="Toggle Theme" aria-label="Toggle Theme">
            <i data-lucide="moon" class="w-4 h-4"></i>
          </button>
          <button id="btn-logout" class="hidden p-3 sm:p-2 text-slate-400 dark:text-slate-500 hover:text-red-500 rounded-xl transition-all hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer" title="Sign Out" aria-label="Sign Out">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
          <button id="btn-reconnect-db" class="p-3 sm:p-2 text-slate-400 dark:text-slate-500 hover:text-brand-600 dark:hover:text-brand-400 rounded-xl transition-all hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer" title="Database Configuration" aria-label="Database Configuration">
            <i data-lucide="database" class="w-4 h-4"></i>
          </button>
          <div class="relative">
            <button id="btn-dev-tools" class="hidden p-3 sm:p-2 text-slate-400 dark:text-slate-500 hover:text-brand-600 dark:hover:text-brand-400 rounded-xl transition-all hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer" title="Developer Tools" aria-label="Developer Tools">
              <i data-lucide="flask-conical" class="w-4 h-4"></i>
            </button>
            <!-- Developer tools popover -->
            <div id="dev-tools-menu" class="hidden absolute right-0 top-full mt-2 w-64 glass-surface border border-slate-200/70 dark:border-slate-700/60 rounded-2xl shadow-2xl p-2 animate-scale-in z-50">
              <p class="px-3 pt-2 pb-1.5 text-[9px] font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500">Developer Tools</p>
              <a href="/eval.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-all cursor-pointer">
                <span class="bg-brand-gradient-soft text-brand-600 dark:text-brand-400 rounded-lg p-2 shrink-0"><i data-lucide="bar-chart-3" class="w-4 h-4"></i></span>
                <span class="min-w-0">
                  <span class="block text-xs font-bold text-slate-800 dark:text-slate-100">Parser Evaluation</span>
                  <span class="block text-[10px] text-slate-400 dark:text-slate-500 truncate">Benchmark models &amp; prompts on receipts</span>
                </span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Global Floating Month Banner (Salary Prompt / Warning) -->
    <div id="global-banners" class="max-w-7xl mx-auto px-4 sm:px-6 pt-4 mb-[-8px] hidden">
      <!-- Container for dynamic alerts -->
    </div>

    <!-- Main Workspace Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6" id="app-content-wrapper">
      <!-- Routing views are populated dynamically in this container -->
      <div id="app-content" class="min-h-[50vh]">
        <!-- Loading Spinner -->
        <div class="flex flex-col items-center justify-center py-20">
          <div class="w-10 h-10 rounded-full bg-conic-brand animate-spin"></div>
          <p class="text-xs text-slate-400 dark:text-slate-500 mt-4 font-mono">Configuring connection...</p>
        </div>
      </div>
    </main>

    <!-- Bottom Navigation Bar (Fixed screen bottom, all screen sizes) -->
    <nav id="bottom-navigation-bar" class="fixed bottom-0 left-0 right-0 z-40 hidden">
      <div class="bottom-nav-inner w-full flex items-center justify-around px-2 pt-1.5">
        <button data-target="dashboard" aria-label="Dashboard" class="bottom-nav-item group text-slate-400">
          <span class="bottom-nav-icon">
            <i data-lucide="pie-chart" class="w-5 h-5 transition-transform duration-200 group-hover:scale-110"></i>
          </span>
          <span class="text-[10px] font-semibold tracking-tight bottom-nav-label">Dashboard</span>
        </button>
        <button data-target="income" aria-label="Income" class="bottom-nav-item group text-slate-400">
          <span class="bottom-nav-icon">
            <i data-lucide="trending-up" class="w-5 h-5 transition-transform duration-200 group-hover:scale-110"></i>
          </span>
          <span class="text-[10px] font-semibold tracking-tight bottom-nav-label">Income</span>
        </button>
        <button data-target="expenses" aria-label="Expenses" class="bottom-nav-item group text-slate-400">
          <span class="bottom-nav-icon">
            <i data-lucide="trending-down" class="w-5 h-5 transition-transform duration-200 group-hover:scale-110"></i>
          </span>
          <span class="text-[10px] font-semibold tracking-tight bottom-nav-label">Expenses</span>
        </button>
        <button data-target="reports" aria-label="Reports" class="bottom-nav-item group text-slate-400">
          <span class="bottom-nav-icon">
            <i data-lucide="file-text" class="w-5 h-5 transition-transform duration-200 group-hover:scale-110"></i>
          </span>
          <span class="text-[10px] font-semibold tracking-tight bottom-nav-label">Reports</span>
        </button>
        <button data-target="assistant" aria-label="Assistant" class="bottom-nav-item group text-slate-400">
          <span class="bottom-nav-icon">
            <i data-lucide="messages-square" class="w-5 h-5 transition-transform duration-200 group-hover:scale-110"></i>
          </span>
          <span class="text-[10px] font-semibold tracking-tight bottom-nav-label">Assistant</span>
        </button>
      </div>
    </nav>

    <!-- Global Modal Overlay (Shared across all actions) -->
    <div id="global-modal" class="fixed inset-0 bg-slate-900/50 dark:bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
      <div id="global-modal-container" class="glass-surface w-full sm:max-w-lg max-h-[92vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl shadow-2xl p-6 sm:p-7 pb-[calc(1.5rem+env(safe-area-inset-bottom,0px))] border-t border-slate-200/60 dark:border-slate-700/50 transition-all transform sm:translate-y-0 translate-y-8 opacity-0">
        <!-- Content injected dynamically -->
      </div>
    </div>

    <!-- Active Loading Overlay for DB Actions -> prevent double post -->
    <div id="action-spinner" class="fixed inset-0 bg-slate-900/20 dark:bg-black/40 backdrop-blur-[2px] z-55 flex items-center justify-center hidden">
      <div class="glass-surface px-5 py-3 rounded-full shadow-2xl flex items-center gap-3">
        <div class="w-4 h-4 border-2 border-brand-500/30 border-t-brand-600 dark:border-t-brand-400 rounded-full animate-spin"></div>
        <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">Syncing changes...</span>
      </div>
    </div>

    <!-- Core App Module Loader -->
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
